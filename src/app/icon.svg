<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#0a0a0a"/>
  <!-- Dimmed left angle bracket, peeks out left of R -->
  <text x="40" y="318" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="240" fill="#065f46">&lt;</text>
  <!-- Dimmed slash-closing-bracket, peeks out right of T -->
  <text x="310" y="318" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="240" fill="#065f46"><tspan fill="#043927">/</tspan>&gt;</text>
  <!-- RT monogram, prominent emerald -->
  <text x="256" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="230" letter-spacing="-4" fill="#34d399">RT</text>
</svg>
