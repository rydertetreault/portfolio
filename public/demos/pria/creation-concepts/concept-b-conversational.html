<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept B — Conversational Create · Praxis AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./shared.css" />
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded')</script>
<style>
/* ── Layout ──────────────────────────────────────────────────────────────── */
.page-wrap {
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}

.chat-shell {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  overflow: hidden; padding: 0 16px;
}

.chat-header {
  width: 100%; max-width: 750px; /* match Pria chat column */
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 0 10px;
}
.chat-header-left { display: flex; align-items: center; gap: 12px; }
.pria-avatar-lg {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--indigo), var(--violet));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 0 0 2px rgba(79,70,229,.3), 0 0 18px rgba(79,70,229,.25);
}
.chat-header-info h2 {
  margin: 0; font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2;
}
.chat-header-info p { margin: 0; font-size: 12px; color: var(--text-soft); }
.restart-btn {
  background: transparent; border: 1px solid var(--border-soft);
  color: var(--text-faint); font-size: 12px; font-weight: 600;
  padding: 7px 14px; border-radius: 999px; cursor: pointer;
  transition: all .15s ease; display: flex; align-items: center; gap: 6px;
}
.restart-btn:hover { color: var(--text); border-color: var(--border); }

/* ── Scroll area ─────────────────────────────────────────────────────────── */
.chat-scroll {
  flex: 1; width: 100%; max-width: 750px; /* match Pria chat column */
  overflow-y: auto; padding: 8px 0 16px;
  display: flex; flex-direction: column; gap: 6px;
  scroll-behavior: smooth;
}
.chat-scroll::-webkit-scrollbar { width: 4px; }
.chat-scroll::-webkit-scrollbar-track { background: transparent; }
.chat-scroll::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 4px; }

/* ── Messages ────────────────────────────────────────────────────────────── */
.msg-row {
  display: flex; gap: 10px; align-items: flex-end;
  animation: msgSlide .3s cubic-bezier(.22,.68,0,1.2) both;
}
@keyframes msgSlide {
  from { opacity: 0; transform: translateY(10px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.msg-row.user { flex-direction: row-reverse; }
.msg-row.user + .msg-row.user { margin-top: 2px; }

.avatar-dot {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--indigo), var(--violet));
  box-shadow: 0 0 0 1.5px rgba(79,70,229,.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.avatar-dot.community-mode {
  background: linear-gradient(135deg, var(--community-from), var(--community-to));
  box-shadow: 0 0 0 1.5px rgba(219,39,119,.4);
}

.bubble {
  max-width: 82%; padding: 12px 16px;
  border-radius: 18px 18px 18px 5px;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  font-size: 14px; line-height: 1.65; color: var(--text);
}
.msg-row.user .bubble {
  background: linear-gradient(135deg, var(--personal-from), var(--personal-to));
  border-color: transparent; border-radius: 18px 18px 5px 18px;
  color: #fff;
}
.msg-row.user.community-mode .bubble {
  background: linear-gradient(135deg, var(--community-from), var(--community-to));
}

/* ── Typing indicator ─────────────────────────────────────────────────────── */
.typing-row { display: flex; gap: 10px; align-items: flex-end;
  animation: msgSlide .25s ease both; }
.typing-bubble {
  padding: 12px 16px; border-radius: 18px 18px 18px 5px;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  display: flex; gap: 5px; align-items: center;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint);
  animation: bounce 1.1s infinite ease-in-out; }
.dot:nth-child(2) { animation-delay: .18s; }
.dot:nth-child(3) { animation-delay: .36s; }
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); opacity:.5; }
  40%          { transform: translateY(-5px); opacity:1; }
}

/* ── Inline quick-reply cards (Step 1) ──────────────────────────────────── */
.qr-cards { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.qr-card {
  flex: 1; min-width: 140px; padding: 14px 16px; border-radius: var(--radius);
  border: 1.5px solid var(--border-soft); background: var(--surface);
  cursor: pointer; transition: all .18s ease; text-align: left;
  display: flex; flex-direction: column; gap: 4px;
}
.qr-card:hover { border-color: var(--indigo); background: rgba(79,70,229,.08); transform: translateY(-2px); }
.qr-card.community:hover { border-color: var(--community-from); background: rgba(124,58,237,.08); }
.qr-card .qr-icon { font-size: 22px; }
.qr-card .qr-label { font-size: 13px; font-weight: 700; color: var(--text); }
.qr-card .qr-sub { font-size: 11.5px; color: var(--text-soft); line-height: 1.4; }

/* ── Suggestion chips ─────────────────────────────────────────────────────── */
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text-soft);
  cursor: pointer; transition: all .15s ease;
}
.chip:hover { color: var(--text); border-color: var(--indigo); background: rgba(79,70,229,.1); }
.chip.community-chip:hover { border-color: var(--community-from); background: rgba(124,58,237,.1); }

/* ── Vibe sliders card ───────────────────────────────────────────────────── */
.vibe-card {
  margin-top: 10px; padding: 16px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border-soft);
}
.slider-row { margin-bottom: 14px; }
.slider-labels { display: flex; justify-content: space-between; margin-bottom: 6px; }
.slider-labels span { font-size: 11px; color: var(--text-faint); font-weight: 600; }
.vibe-slider {
  width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer;
  -webkit-appearance: none;
  background: var(--surface-3);
}
.vibe-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(135deg, var(--indigo), var(--violet));
  cursor: pointer; border: 2px solid var(--bg);
  box-shadow: 0 0 0 2px rgba(79,70,229,.4);
}
.vibe-slider.community-slider::-webkit-slider-thumb {
  background: linear-gradient(135deg, var(--community-from), var(--community-to));
  box-shadow: 0 0 0 2px rgba(219,39,119,.4);
}
.vibe-confirm-btn {
  width: 100%; padding: 10px; font-size: 13px; font-weight: 700;
  background: linear-gradient(90deg, var(--indigo), var(--violet));
  border: none; border-radius: var(--radius-sm); color: #fff; cursor: pointer;
  margin-top: 4px; transition: opacity .15s, transform .12s;
}
.vibe-confirm-btn:hover { opacity: .88; transform: translateY(-1px); }
.vibe-confirm-btn.community-btn { background: linear-gradient(90deg, var(--community-from), var(--community-to)); }

/* ── Persona card ────────────────────────────────────────────────────────── */
.persona-card {
  margin-top: 10px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border-soft);
  overflow: hidden;
}
.persona-card-top {
  padding: 18px 18px 14px;
  background: linear-gradient(135deg, rgba(79,70,229,.18), rgba(124,58,237,.1));
  display: flex; align-items: center; gap: 14px;
}
.persona-card-top.community { background: linear-gradient(135deg, rgba(124,58,237,.18), rgba(219,39,119,.1)); }
.persona-avatar {
  width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--indigo), var(--violet));
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; box-shadow: 0 0 0 2px rgba(79,70,229,.3);
}
.persona-avatar.community { background: linear-gradient(135deg, var(--community-from), var(--community-to)); box-shadow: 0 0 0 2px rgba(219,39,119,.3); }
.persona-card-top h3 { margin: 0 0 5px; font-size: 17px; font-weight: 800; color: var(--text); }
.persona-card-body { padding: 14px 18px; }
.persona-summary { font-size: 13.5px; line-height: 1.7; color: var(--text-soft); margin: 0 0 12px; }
.persona-summary textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-sans);
  font-size: 13.5px; line-height: 1.7; padding: 10px 12px; resize: vertical;
  min-height: 90px; outline: none;
}
.persona-summary textarea:focus { border-color: var(--indigo); }
.style-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
.style-chip {
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  padding: 4px 11px; border-radius: 999px;
  background: rgba(79,70,229,.14); color: var(--accent-text);
  border: 1px solid rgba(79,70,229,.3);
}
.style-chip.community { background: rgba(219,39,119,.12); color: #f9a8d4; border-color: rgba(219,39,119,.3); }
.persona-card-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.tweak-btn, .create-btn {
  flex: 1; min-width: 130px; padding: 11px 16px; border-radius: var(--radius-sm);
  font-family: var(--font-sans); font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all .15s ease; border: none;
}
.tweak-btn {
  background: var(--surface-2); color: var(--text-soft);
  border: 1px solid var(--border-soft);
}
.tweak-btn:hover { color: var(--text); border-color: var(--border); }
.create-btn {
  color: #fff; background: linear-gradient(90deg, var(--indigo), var(--violet));
}
.create-btn.community { background: linear-gradient(90deg, var(--community-from), var(--community-to)); }
.create-btn:hover { opacity: .88; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,.3); }

/* ── Progress card ───────────────────────────────────────────────────────── */
.progress-card {
  margin-top: 10px; padding: 16px 18px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border-soft);
}
.progress-phase { font-size: 13.5px; color: var(--text); margin-bottom: 10px; font-weight: 600; }
.progress-track {
  height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--indigo), var(--violet));
  transition: width .9s ease;
}
.progress-fill.community { background: linear-gradient(90deg, var(--community-from), var(--community-to)); }

/* ── Success card ────────────────────────────────────────────────────────── */
.success-card {
  margin-top: 10px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border-soft); overflow: hidden;
}
.success-banner {
  padding: 18px 18px 14px;
  background: linear-gradient(135deg, rgba(16,185,129,.14), rgba(6,182,212,.08));
  border-bottom: 1px solid rgba(16,185,129,.2);
}
.success-banner h3 { margin: 0 0 4px; font-size: 18px; font-weight: 800; color: #6ee7b7; }
.success-banner p { margin: 0; font-size: 13px; color: var(--text-soft); }
.defaults-note {
  padding: 14px 18px;
  font-size: 12.5px; line-height: 1.65; color: var(--text-faint);
}
.defaults-note strong { color: var(--text-soft); }
.success-actions { display: flex; gap: 10px; padding: 0 18px 18px; flex-wrap: wrap; }
.success-btn {
  flex: 1; min-width: 120px; padding: 11px 16px; border-radius: var(--radius-sm);
  font-family: var(--font-sans); font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all .15s ease; border: none;
  background: linear-gradient(90deg, var(--success), var(--cyan));
  color: #fff;
}
.success-btn:hover { opacity: .85; transform: translateY(-1px); }
.success-btn.ghost-success {
  background: var(--surface-2); color: var(--text-soft);
  border: 1px solid var(--border-soft);
}
.success-btn.ghost-success:hover { color: var(--text); border-color: var(--border); }
.stat-line {
  text-align: center; font-size: 11.5px; color: var(--text-faint);
  padding: 8px 0 4px; margin-top: 4px;
  animation: msgSlide .4s ease both;
}
.stat-line span { color: var(--text-soft); font-weight: 700; }

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-soft); font-size: 13px; font-weight: 600;
  padding: 10px 20px; border-radius: 999px;
  opacity: 0; transition: all .25s ease; pointer-events: none; z-index: 99;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Input bar ───────────────────────────────────────────────────────────── */
.input-shell { width: 100%; display: flex; justify-content: center; padding: 10px 16px 18px; }
.input-bar {
  width: 100%; max-width: 750px; /* match Pria chat column */
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: 18px; overflow: hidden;
  transition: border-color .15s ease;
}
.input-bar:focus-within { border-color: var(--indigo); }
.input-bar.community-focus:focus-within { border-color: var(--community-from); }
.input-progress {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px 4px; font-size: 11px; color: var(--text-faint); font-weight: 600;
}
.time-left { letter-spacing: .03em; }
.step-pips { display: flex; gap: 4px; align-items: center; }
.pip {
  width: 18px; height: 4px; border-radius: 2px;
  background: var(--surface-3); transition: background .3s ease;
}
.pip.done { background: var(--indigo); }
.pip.done.community { background: var(--community-from); }
.pip.active { background: rgba(79,70,229,.5); }
.pip.active.community { background: rgba(124,58,237,.5); }
.input-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px 12px; }
.chat-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--font-sans); font-size: 14px;
  placeholder-color: var(--text-faint);
  caret-color: var(--indigo);
}
.chat-input::placeholder { color: var(--text-faint); }
.chat-input:disabled { cursor: not-allowed; opacity: .4; }
.send-btn {
  width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--indigo), var(--violet));
  color: #fff; display: flex; align-items: center; justify-content: center;
  transition: all .15s ease; flex-shrink: 0;
}
.send-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 4px 14px rgba(79,70,229,.4); }
.send-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; box-shadow: none; }
.send-btn.community { background: linear-gradient(135deg, var(--community-from), var(--community-to)); }
.send-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<!-- ── Topbar ─────────────────────────────────────────────────────────────── -->
<header class="cc-topbar">
  <a href="./index.html" class="brand">Praxis · Creation Concepts</a>
  <span class="crumb">Concept B — Conversational Create</span>
  <span class="spacer"></span>
  <a href="./concept-a-express.html"      class="nav-pill">A</a>
  <a href="./concept-b-conversational.html" class="nav-pill active">B</a>
  <a href="./concept-c-single-page.html"  class="nav-pill">C</a>
  <a href="./concept-d-templates.html"    class="nav-pill">D</a>
  <a href="./concept-e-combined.html"     class="nav-pill">E ★</a>
</header>

<!-- ── Page wrap ─────────────────────────────────────────────────────────── -->
<div class="page-wrap">
  <div class="chat-shell">

    <!-- Chat header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="pria-avatar-lg" id="priaAvatarLg">✦</div>
        <div class="chat-header-info">
          <h2>Pria</h2>
          <p>Praxis creation assistant · ~60 sec</p>
        </div>
      </div>
      <button class="restart-btn" onclick="restartConversation()">↺ Restart</button>
    </div>

    <!-- Chat scroll -->
    <div class="chat-scroll" id="chatScroll"></div>

  </div>

  <!-- Input bar -->
  <div class="input-shell">
    <div class="input-bar" id="inputBar">
      <div class="input-progress">
        <span class="time-left" id="timeLeft">~60s left</span>
        <div class="step-pips" id="stepPips"></div>
      </div>
      <div class="input-row">
        <input type="text" class="chat-input" id="chatInput"
               placeholder="Type a reply…" autocomplete="off" disabled />
        <button class="send-btn" id="sendBtn" disabled onclick="handleSend()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ─── State ─────────────────────────────────────────────────────────────── */
const STATE = {
  step: 0,          // which question we're on (0 = not started)
  category: null,   // 'personal' | 'community'
  name: '',
  basedOn: '',
  role: '',
  helps: '',
  audience: '',
  style: '',
  tone: 50,
  detail: 50,
  warmth: 50,
  done: false,
};

const TOTAL_STEPS = 7;
const STEP_SECONDS = [60, 52, 44, 36, 28, 20, 12, 0];

/* ─── Helpers ───────────────────────────────────────────────────────────── */
const scroll    = () => { const el = document.getElementById('chatScroll'); requestAnimationFrame(() => el.scrollTop = el.scrollHeight); };
const isCom     = () => STATE.category === 'community';
const accentCls = (base) => isCom() ? `${base} community` : base;
const $ = id => document.getElementById(id);

function showToast(msg) {
  const t = $('toast'); t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updatePips() {
  const wrap = $('stepPips'); wrap.innerHTML = '';
  for (let i = 0; i < TOTAL_STEPS; i++) {
    const d = document.createElement('div');
    const s = STATE.step - 1;
    d.className = 'pip' + (i < s ? ' done' + (isCom() ? ' community' : '') : i === s ? ' active' + (isCom() ? ' community' : '') : '');
    wrap.appendChild(d);
  }
}

function updateTimer() {
  const idx = Math.min(STATE.step, STEP_SECONDS.length - 1);
  const secs = STEP_SECONDS[Math.max(0, idx)];
  $('timeLeft').textContent = secs > 0 ? `~${secs}s left` : '✓ Done!';
}

function enableInput(placeholder = 'Type a reply…') {
  const inp = $('chatInput'), btn = $('sendBtn');
  inp.placeholder = placeholder; inp.disabled = false; inp.focus();
  btn.disabled = false;
  if (isCom()) { btn.classList.add('community'); } else { btn.classList.remove('community'); }
  if (isCom()) { $('inputBar').classList.add('community-focus'); } else { $('inputBar').classList.remove('community-focus'); }
}

function disableInput() {
  $('chatInput').disabled = true; $('sendBtn').disabled = true;
}

/* ─── Message builders ───────────────────────────────────────────────────── */
function addUserBubble(text) {
  const row = document.createElement('div');
  row.className = `msg-row user${isCom() ? ' community-mode' : ''}`;
  row.innerHTML = `<div class="bubble">${text}</div>`;
  $('chatScroll').appendChild(row); scroll();
}

function addAssistantBubble(html) {
  const row = document.createElement('div');
  row.className = 'msg-row';
  const dot = document.createElement('div');
  dot.className = `avatar-dot${isCom() ? ' community-mode' : ''}`;
  dot.textContent = '✦';
  const bub = document.createElement('div');
  bub.className = 'bubble'; bub.innerHTML = html;
  row.appendChild(dot); row.appendChild(bub);
  $('chatScroll').appendChild(row); scroll();
  return bub;
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'typing-row'; row.id = 'typingRow';
  row.innerHTML = `<div class="avatar-dot${isCom() ? ' community-mode' : ''}">✦</div>
    <div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  $('chatScroll').appendChild(row); scroll();
}

function removeTyping() {
  const t = $('typingRow'); if (t) t.remove();
}

function pria(htmlOrFn, delay = 700, after) {
  disableInput();
  setTimeout(() => {
    addTyping(); scroll();
    const content = typeof htmlOrFn === 'function' ? htmlOrFn() : htmlOrFn;
    const extraDelay = Math.min(800, content.replace(/<[^>]+>/g,'').length * 18);
    setTimeout(() => {
      removeTyping();
      addAssistantBubble(content);
      if (after) after();
    }, extraDelay);
  }, delay);
}

/* ─── Conversation steps ────────────────────────────────────────────────── */
function startConversation() {
  STATE.step = 1; updatePips(); updateTimer();
  pria(`Hi! I'm <strong>Pria</strong>. I'll help you create a digital twin — takes about a minute. 
        First: is this twin <em>you</em>, or someone your community will subscribe to?`, 400, () => {
    const bub = $('chatScroll').lastElementChild.querySelector('.bubble');
    const cards = document.createElement('div'); cards.className = 'qr-cards';
    cards.innerHTML = `
      <button class="qr-card" onclick="chooseCategory('personal')">
        <div class="qr-icon">🧍</div>
        <div class="qr-label">Personal</div>
        <div class="qr-sub">A twin of myself</div>
      </button>
      <button class="qr-card community" onclick="chooseCategory('community')">
        <div class="qr-icon">🌟</div>
        <div class="qr-label">Community</div>
        <div class="qr-sub">A twin others can subscribe to</div>
      </button>`;
    bub.appendChild(cards); scroll();
  });
}

function chooseCategory(cat) {
  STATE.category = cat; STATE.step = 2;
  // Remove cards
  const cards = document.querySelectorAll('.qr-card');
  cards.forEach(c => { c.disabled = true; c.style.opacity = '.45'; c.style.pointerEvents = 'none'; });
  addUserBubble(cat === 'personal' ? '🧍 Personal — a twin of myself' : '🌟 Community — a twin of someone others can subscribe to');
  // Update pria avatar
  if (cat === 'community') $('priaAvatarLg').classList.add('community-mode');
  updatePips(); updateTimer();
  pria(`What should your twin be called?`, 500, () => enableInput('Enter a name…'));
}

function step2_name(val) {
  STATE.name = val; STATE.step = 3;
  updatePips(); updateTimer();
  if (isCom()) {
    pria(`Got it — <strong>${val}</strong>! And who is this twin based on?`, 400, () => enableInput(`Who is ${val} based on?`));
  } else {
    askStep3();
  }
}

function step2b_basedOn(val) {
  STATE.basedOn = val;
  askStep3();
}

function askStep3() {
  STATE.step = 3; updatePips(); updateTimer();
  const n = STATE.name;
  pria(`In one sentence — what role should <strong>${n}</strong> play?<br>
        <span style="color:var(--text-faint);font-size:12px;">e.g. "startup mentor", "physics tutor", "my grandmother's stories"</span>`,
    400, () => enableInput(`Describe ${n}'s role…`));
}

function step3_role(val) {
  STATE.role = val; STATE.step = 4; updatePips(); updateTimer();
  pria(`What should <strong>${STATE.name}</strong> help people with most often?`, 400, () => enableInput('What they help with…'));
}

function step4_helps(val) {
  STATE.helps = val; STATE.step = 5; updatePips(); updateTimer();
  const personal_chips = ['Just me','My team','My clients'];
  const community_chips = ['My subscribers','Students','Fans'];
  const chips = isCom() ? community_chips : personal_chips;
  pria(`Who'll be talking to <strong>${STATE.name}</strong> the most?`, 400, () => {
    const bub = $('chatScroll').lastElementChild.querySelector('.bubble');
    const row = document.createElement('div'); row.className = 'chip-row';
    chips.forEach(c => {
      const btn = document.createElement('button');
      btn.className = `chip${isCom() ? ' community-chip' : ''}`;
      btn.textContent = c;
      btn.onclick = () => { chipSelect(c, row); };
      row.appendChild(btn);
    });
    bub.appendChild(row); scroll();
    enableInput('Or type your own…');
  });
}

function chipSelect(val, rowEl) {
  rowEl.querySelectorAll('.chip').forEach(c => { c.style.opacity = '.4'; c.style.pointerEvents = 'none'; });
  $('chatInput').value = '';
  handleAudienceReply(val);
}

function handleAudienceReply(val) {
  STATE.audience = val; STATE.step = 6; updatePips(); updateTimer();
  disableInput();
  addUserBubble(val);
  const styles = ['Direct','Encouraging','Analytical','Balanced'];
  pria(`Pick <strong>${STATE.name}</strong>'s advice style:`, 400, () => {
    const bub = $('chatScroll').lastElementChild.querySelector('.bubble');
    const row = document.createElement('div'); row.className = 'chip-row';
    styles.forEach(s => {
      const btn = document.createElement('button');
      btn.className = `chip${isCom() ? ' community-chip' : ''}`;
      btn.textContent = s;
      btn.onclick = () => { styleSelect(s, row); };
      row.appendChild(btn);
    });
    bub.appendChild(row); scroll();
  });
}

function styleSelect(val, rowEl) {
  rowEl.querySelectorAll('.chip').forEach(c => { c.style.opacity = '.4'; c.style.pointerEvents = 'none'; });
  STATE.style = val; STATE.step = 7; updatePips(); updateTimer();
  addUserBubble(val);
  pria(`Last one — drag the vibe:`, 400, () => {
    const bub = $('chatScroll').lastElementChild.querySelector('.bubble');
    const comCls = isCom() ? ' community-slider' : '';
    const comBtn = isCom() ? ' community-btn' : '';
    bub.innerHTML += `
      <div class="vibe-card">
        <div class="slider-row">
          <div class="slider-labels"><span>Direct</span><span>Expressive</span></div>
          <input type="range" class="vibe-slider${comCls}" id="sliderTone" min="0" max="100" value="50">
        </div>
        <div class="slider-row">
          <div class="slider-labels"><span>Concise</span><span>Detailed</span></div>
          <input type="range" class="vibe-slider${comCls}" id="sliderDetail" min="0" max="100" value="50">
        </div>
        <div class="slider-row" style="margin-bottom:0">
          <div class="slider-labels"><span>Professional</span><span>Warm</span></div>
          <input type="range" class="vibe-slider${comCls}" id="sliderWarmth" min="0" max="100" value="50">
        </div>
        <button class="vibe-confirm-btn${comBtn}" onclick="vibeConfirm()">That's the vibe ✓</button>
      </div>`;
    scroll();
  });
}

function vibeConfirm() {
  STATE.tone    = $('sliderTone')?.value   || 50;
  STATE.detail  = $('sliderDetail')?.value || 50;
  STATE.warmth  = $('sliderWarmth')?.value || 50;

  document.querySelectorAll('.vibe-confirm-btn').forEach(b => { b.disabled = true; b.textContent = '✓ Locked in'; b.style.opacity = '.55'; });
  document.querySelectorAll('.vibe-slider').forEach(s => s.disabled = true);

  const toneLabel   = STATE.tone   > 60 ? 'expressive' : STATE.tone   < 40 ? 'direct'       : 'balanced tone';
  const detailLabel = STATE.detail > 60 ? 'detailed'   : STATE.detail < 40 ? 'concise'       : 'balanced depth';
  const warmthLabel = STATE.warmth > 60 ? 'warm'       : STATE.warmth < 40 ? 'professional'  : 'neutral warmth';

  addUserBubble(`Tone: ${toneLabel} · Detail: ${detailLabel} · Warmth: ${warmthLabel}`);
  STATE.step = 8; updatePips(); updateTimer();

  pria(`Perfect. Give me a moment…`, 400, () => {
    setTimeout(() => {
      removeTyping(); // just in case
      setTimeout(() => showPersonaCard(toneLabel, detailLabel, warmthLabel), 1500);
    }, 100);
  });
}

function showPersonaCard(toneLabel, detailLabel, warmthLabel) {
  const n = STATE.name;
  const comTop = isCom() ? ' community' : '';
  const comAvt = isCom() ? ' community' : '';
  const summary = buildSummary();

  const row = document.createElement('div'); row.className = 'msg-row';
  const dot = document.createElement('div');
  dot.className = `avatar-dot${isCom() ? ' community-mode' : ''}`; dot.textContent = '✦';
  const bub = document.createElement('div'); bub.className = 'bubble'; bub.style.maxWidth = '100%';

  bub.innerHTML = `
    <div style="margin-bottom:4px;font-size:13.5px;">Here's your <strong>${n}</strong> persona — look good?</div>
    <div class="persona-card">
      <div class="persona-card-top${comTop}">
        <div class="persona-avatar${comAvt}">🤖</div>
        <div>
          <h3>${n}</h3>
          <span class="cc-badge ${isCom() ? 'community' : 'personal'}">${isCom() ? '🌟 Community' : '🧍 Personal'}</span>
        </div>
      </div>
      <div class="persona-card-body">
        <div class="persona-summary" id="summaryDisplay">${summary}</div>
        <div class="style-chips">
          <span class="style-chip${isCom() ? ' community' : ''}">Style: ${STATE.style}</span>
          <span class="style-chip${isCom() ? ' community' : ''}">Tone: ${toneLabel}</span>
          <span class="style-chip${isCom() ? ' community' : ''}">Depth: ${detailLabel}</span>
          <span class="style-chip${isCom() ? ' community' : ''}">Warmth: ${warmthLabel}</span>
        </div>
        <div class="persona-card-actions">
          <button class="tweak-btn" onclick="tweakInstructions(this, \`${escQ(summary)}\`)">✏️ Tweak instructions</button>
          <button class="create-btn${comTop}" id="createBtn" onclick="createTwin()">🚀 Create ${n}</button>
        </div>
      </div>
    </div>`;

  row.appendChild(dot); row.appendChild(bub);
  $('chatScroll').appendChild(row); scroll();
  $('timeLeft').textContent = '✓ Done!';
}

function buildSummary() {
  const n = STATE.name;
  const who = isCom() ? `${n} (based on ${STATE.basedOn || 'the real person'})` : n;
  return `${who} serves as a <em>${STATE.role || 'helpful guide'}</em> and primarily helps with <em>${STATE.helps || 'various tasks'}</em>. 
          The main audience is <em>${STATE.audience || 'users'}</em>. 
          ${n} communicates in a <em>${STATE.style?.toLowerCase() || 'balanced'}</em> style, keeping responses appropriately detailed while maintaining an authentic voice. 
          Every interaction is guided by ${n}'s core expertise and perspective.`;
}

function escQ(s) { return s.replace(/`/g, '\\`').replace(/\$/g, '\\$'); }

function tweakInstructions(btn, summary) {
  const disp = $('summaryDisplay');
  if (disp.querySelector('textarea')) { return; }
  const ta = document.createElement('textarea');
  ta.value = disp.innerText;
  disp.innerHTML = ''; disp.appendChild(ta);
  btn.textContent = '✓ Save changes';
  btn.onclick = () => {
    const val = ta.value;
    disp.innerHTML = val;
    btn.textContent = '✏️ Tweak instructions';
    btn.onclick = () => tweakInstructions(btn, val);
  };
}

function createTwin() {
  $('createBtn').disabled = true;
  document.querySelectorAll('.tweak-btn, .create-btn').forEach(b => { b.disabled = true; b.style.opacity = '.4'; });

  const phases = [
    'Seeding digital twin…',
    'Infusing personality…',
    'Shaping voice & tone…',
    'Awakening consciousness…',
  ];
  const comFill = isCom() ? ' community' : '';

  const row = document.createElement('div'); row.className = 'msg-row';
  const dot = document.createElement('div');
  dot.className = `avatar-dot${isCom() ? ' community-mode' : ''}`; dot.textContent = '✦';
  const bub = document.createElement('div'); bub.className = 'bubble'; bub.style.maxWidth = '90%';

  bub.innerHTML = `
    <div class="progress-card">
      <div class="progress-phase" id="progressPhase">${phases[0]}</div>
      <div class="progress-track"><div class="progress-fill${comFill}" id="progressFill" style="width:8%"></div></div>
    </div>`;

  row.appendChild(dot); row.appendChild(bub);
  $('chatScroll').appendChild(row); scroll();

  let ph = 0;
  const pct = [8, 33, 65, 88];
  const tick = () => {
    const phase = $('progressPhase'); const fill = $('progressFill');
    if (!phase) return;
    if (ph < phases.length) {
      phase.textContent = phases[ph];
      fill.style.width = pct[ph] + '%';
      ph++;
      setTimeout(tick, 1100);
    } else {
      fill.style.width = '100%';
      phase.textContent = '✓ Complete!';
      setTimeout(showSuccess, 700);
    }
  };
  setTimeout(tick, 1100);
}

function showSuccess() {
  const n = STATE.name;
  const row = document.createElement('div'); row.className = 'msg-row';
  const dot = document.createElement('div');
  dot.className = `avatar-dot${isCom() ? ' community-mode' : ''}`; dot.textContent = '✦';
  const bub = document.createElement('div'); bub.className = 'bubble'; bub.style.maxWidth = '100%';

  const joinNote = isCom() ? 'Subscriptions: <strong>disabled by default</strong>' : 'Joining: <strong>private</strong>';

  bub.innerHTML = `
    <div class="success-card">
      <div class="success-banner">
        <h3>🎉 ${n} is alive!</h3>
        <p>Your digital twin has been created and is ready to chat.</p>
      </div>
      <div class="defaults-note">
        <strong>Auto-defaults applied:</strong> ${joinNote} · Credits: <strong>pooled</strong> · Voice: <strong>off</strong> — change anytime in <strong>Settings</strong>.
      </div>
      <div class="success-actions">
        <button class="success-btn" onclick="showToast('Prototype — not wired')">💬 Start chatting</button>
        <button class="success-btn ghost-success" onclick="showToast('Prototype — not wired')">📎 Add knowledge files</button>
      </div>
    </div>`;

  row.appendChild(dot); row.appendChild(bub);
  $('chatScroll').appendChild(row);

  const stat = document.createElement('div');
  stat.className = 'stat-line';
  stat.innerHTML = `<span>1 conversation · 7 questions · ~60 seconds</span> &nbsp;·&nbsp; old flow: 8 steps · 14 questions`;
  $('chatScroll').appendChild(stat);
  scroll();

  STATE.done = true;
  $('timeLeft').textContent = '✓ Done!';
  disableInput();
  $('chatInput').placeholder = 'Twin created!';
}

/* ─── Input handling ─────────────────────────────────────────────────────── */
$('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

function handleSend() {
  const inp = $('chatInput');
  const val = inp.value.trim(); if (!val) return;
  inp.value = ''; disableInput();
  addUserBubble(val);

  const s = STATE.step;
  if (s === 2) {
    step2_name(val);
  } else if (s === 3 && isCom() && !STATE.basedOn) {
    STATE.step = 3; // hold step 3 label until basedOn answered
    step2b_basedOn(val);
  } else if (s === 3) {
    step3_role(val);
  } else if (s === 4) {
    step4_helps(val);
  } else if (s === 5) {
    handleAudienceReply(val);
  } else {
    addUserBubble('...');
  }
}

/* ─── Restart ───────────────────────────────────────────────────────────── */
function restartConversation() {
  Object.assign(STATE, { step:0, category:null, name:'', basedOn:'', role:'', helps:'', audience:'', style:'', tone:50, detail:50, warmth:50, done:false });
  $('chatScroll').innerHTML = '';
  $('chatInput').value = ''; disableInput();
  $('chatInput').placeholder = 'Type a reply…';
  $('priaAvatarLg').classList.remove('community-mode');
  $('inputBar').classList.remove('community-focus');
  $('timeLeft').textContent = '~60s left';
  $('stepPips').innerHTML = '';
  startConversation();
}

/* ─── Boot ───────────────────────────────────────────────────────────────── */
startConversation();
</script>
<script>
// Concept-only marketing links must not navigate into the portfolio.
document.addEventListener('click', function (event) {
  const link = event.target.closest('a[href]');
  if (!link) return;
  const url = new URL(link.href, location.href);
  if (url.origin === location.origin && !url.pathname.startsWith('/demos')) {
    event.preventDefault();
    alert('This is a design concept. This destination is not part of the demo.');
  }
});
</script></body>
</html>
